<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OMAD TOUR</title>
<style>
:root{
  --bg-1:#26081b;
  --bg-2:#5c1640;
  --bg-3:#82205a;
  --glass-bg: rgba(255,255,255,0.09);
  --glass-bg-strong: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.24);
  --text:#ffffff;
  --text-dim: rgba(255,255,255,0.72);
  --accent:#e8437a;
  --accent-2:#ffd1e6;
  --danger:#e0304a;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --maxw: 460px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
canvas#bgcanvas{
  position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
}
#app{
  position:relative; z-index:1;
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100vh;
  padding:18px 16px 40px;
}
.screen{display:none; animation:fadeSlide .32s ease;}
.screen.active{display:block;}
@keyframes fadeSlide{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-bottom:18px; min-height:38px;
}
.topbar.only-lang{justify-content:flex-end;}
.back-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(224,48,74,0.88);
  color:#fff; border:none; border-radius:20px;
  padding:8px 18px 8px 12px; font-size:14px; font-weight:600;
  cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.3);
  white-space:nowrap;
}
.back-btn svg{width:16px;height:16px;flex-shrink:0;}
.lang-switch{display:flex; gap:6px;}
.lang-btn{
  display:flex; align-items:center; gap:4px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--text); border-radius:14px; padding:6px 9px;
  font-size:12px; font-weight:600; cursor:pointer;
}
.lang-btn.active{background:var(--glass-bg-strong); border-color:var(--accent-2);}
.lang-btn svg{width:16px;height:12px;border-radius:2px;}

.logo-wrap{display:flex; justify-content:center; margin: 6px 0 18px;}
.logo-circle{
  width:112px; height:112px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #a8386e, #7a1a4d 70%);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(255,255,255,0.12), 0 8px 30px rgba(0,0,0,0.4);
  overflow:hidden;
}
.logo-circle svg{width:100%;height:100%;}

.greeting{
  text-align:center; font-size:15.5px; line-height:1.5;
  color:var(--text); margin:0 0 22px; padding:0 6px;
  font-weight:500;
}

.btn-stack{display:flex; flex-direction:column; gap:14px;}
.glass-btn{
  display:flex; align-items:center; gap:12px;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius-lg);
  padding:16px 18px;
  color:var(--text); font-size:15.5px; font-weight:600;
  text-align:left; cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.28);
  transition:transform .15s ease, background .15s ease;
  width:100%;
}
.glass-btn:active{transform:scale(0.97); background:var(--glass-bg-strong);}
.glass-btn .arrow{margin-left:auto; opacity:0.7; font-weight:700;}
.icon-round{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.icon-round svg{width:100%;height:100%;}
.icon-round.sm{width:26px;height:26px;}

.section-text{
  font-size:14.5px; line-height:1.6; color:var(--text-dim);
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius-md); padding:16px; margin-bottom:20px;
}
.city-list{display:flex; flex-direction:column; gap:10px;}
.city-btn{
  display:flex; align-items:center; gap:10px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius-sm); padding:13px 16px;
  color:var(--text); font-size:14.5px; font-weight:500; cursor:pointer; width:100%;
  text-align:left;
}
.city-btn:active{background:var(--glass-bg-strong);}
.city-btn .flag-ico{width:22px;height:16px;border-radius:3px;flex-shrink:0;}

.field-label{font-size:14px; font-weight:600; margin:4px 0 10px; color:var(--text);}
.required-star{color:var(--danger); font-weight:800; margin-left:3px;}
.text-input, textarea.text-input{
  width:100%; border-radius:var(--radius-sm); border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.94); color:#2a1020;
  padding:13px 14px; font-size:14.5px; margin-bottom:16px; font-family:inherit;
}
textarea.text-input{min-height:120px; resize:vertical;}
.next-btn{
  background:linear-gradient(135deg,var(--accent),#b9235d);
  color:#fff; border:none; border-radius:var(--radius-sm);
  padding:14px; font-size:15px; font-weight:700; cursor:pointer; width:100%;
  box-shadow:0 6px 18px rgba(0,0,0,0.3);
}
.next-btn:disabled{opacity:0.45; cursor:not-allowed;}
.err-msg{color:#ffb3c4; font-size:13px; margin:-10px 0 14px; display:none;}

/* Calendar - white per spec */
.calendar-card{
  background:#ffffff; color:#241028; border-radius:var(--radius-lg);
  padding:16px; box-shadow:0 10px 30px rgba(0,0,0,0.35);
}
.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-nav{
  background:#f2e4ea; border:none; width:34px; height:34px; border-radius:50%;
  font-size:16px; cursor:pointer; color:#82205a; font-weight:700;
}
.cal-title{font-weight:700; font-size:15.5px;}
.cal-weekdays,.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
.cal-weekdays div{font-size:11.5px; color:#9a7284; font-weight:700; padding:4px 0;}
.cal-day{
  padding:9px 0; border-radius:10px; font-size:13.5px; cursor:pointer; font-weight:500;
  color:#241028;
}
.cal-day.blank{visibility:hidden;}
.cal-day.past{color:#cbb9c2; cursor:not-allowed;}
.cal-day:not(.past):not(.blank):hover{background:#f2e4ea;}
.cal-day.selected{background:var(--accent); color:#fff; font-weight:700;}

.msg-box{
  background:rgba(255,255,255,0.95); color:#2a1020; border-radius:var(--radius-md);
  padding:14px; font-size:13.5px; line-height:1.6; white-space:pre-line;
  margin-bottom:18px; border:1px solid var(--glass-border);
}
.contact-list{display:flex; flex-direction:column; gap:12px;}
.contact-btn{
  display:flex; align-items:center; gap:12px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius-md); padding:13px 16px; color:var(--text);
  font-size:14.5px; font-weight:600; text-decoration:none; cursor:pointer;
}
.contact-btn:active{background:var(--glass-bg-strong);}

.address-block{
  animation:addrFade 1.1s ease;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:var(--radius-md); padding:16px; margin-bottom:14px;
  font-size:14px; line-height:1.7;
}
@keyframes addrFade{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.addr-title{font-weight:700; margin-bottom:6px; font-size:14.5px;}

@media (prefers-reduced-motion: reduce){
  .screen{animation:none;}
  .address-block{animation:none;}
}
</style>
</head>

/* ================= NAV ================= */
let screenStack = [];
let currentScreenId = 'screen-home';
function showScreen(id){
  screenStack.push(currentScreenId);
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  currentScreenId = id;
  window.scrollTo(0,0);
}
function goBack(){
  if(screenStack.length===0) return;
  const prev = screenStack.pop();
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById(prev).classList.add('active');
  currentScreenId = prev;
  window.scrollTo(0,0);
}

/* ================= LANG ================= */
function buildLangSwitchers(){
  const langs = [
    {code:'uz', flag:svgFlagUZ(), label:'UZ'},
    {code:'ru', flag:svgFlagRU(), label:'RU'},
    {code:'en', flag:'<svg viewBox="0 0 30 20" class="flag-ico"><rect width="30" height="20" fill="#00247d"/><rect width="30" height="20" fill="#00247d"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="3"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="4"/><path d="M15 0V20M0 10H30" stroke="#cf142b" stroke-width="2"/></svg>', label:'EN'}
  ];
  document.querySelectorAll('[id^="lang-switch"]').forEach(container=>{
    container.innerHTML = langs.map(l=>
      `<button class="lang-btn ${l.code===currentLang?'active':''}" onclick="setLang('${l.code}')">${l.flag}<span>${l.label}</span></button>`
    ).join('');
  });
}
function setLang(code){
  currentLang = code;
  document.documentElement.lang = code;
  applyLang();
  buildLangSwitchers();
  // refresh dynamic screens that depend on language
  if(document.getElementById('city1-list').childElementCount) refreshCityQuestion();
  refreshDynamicText();
}
function applyLang(){
  const t = translations[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(t[k]!==undefined) el.textContent = t[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const k = el.getAttribute('data-i18n-placeholder');
    if(t[k]!==undefined) el.setAttribute('placeholder', t[k]);
  });
}

/* ================= BOOKING FLOW ================= */
let booking = {mode:null, from:null, to:null, fromManual:null, toManual:null, date:null};

function startBooking(mode){
  booking = {mode, from:null, to:null, fromManual:null, toManual:null, date:null};
  if(mode==='ru-uz'){
    renderCityList('ru','city1');
    document.getElementById('city1-question').textContent = translations[currentLang].ask_ru_city_from;
    showScreen('screen-city1');
  } else if(mode==='uz-ru'){
    renderCityList('uz','city1');
    document.getElementById('city1-question').textContent = translations[currentLang].ask_uz_city_from;
    showScreen('screen-city1');
  } else {
    document.getElementById('input-from-manual').value='';
    document.getElementById('input-to-manual').value='';
    document.getElementById('err-from-manual').style.display='none';
    showScreen('screen-manual-from');
  }
}
function refreshCityQuestion(){
  if(!booking.mode) return;
  const t = translations[currentLang];
  if(booking.mode==='ru-uz') document.getElementById('city1-question').textContent = t.ask_ru_city_from;
  if(booking.mode==='uz-ru') document.getElementById('city1-question').textContent = t.ask_uz_city_from;
}
function renderCityList(which, target){
  const list = which==='ru' ? RU_CITIES : UZ_CITIES;
  const container = document.getElementById(target+'-list');
  container.innerHTML = '';
  list.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'city-btn';
    btn.innerHTML = (which==='ru'?svgFlagRU():svgFlagUZ()) + `<span>${c[currentLang]}</span>`;
    btn.onclick = ()=> selectCity(which, c, target);
    container.appendChild(btn);
  });
}
function selectCity(which, c, target){
  if(c.airports){
    renderAirportList(c, target);
    showScreen('screen-airport');
    return;
  }
  if(target==='city1'){
    booking.from = c;
    nextCityStep();
  } else {
    booking.to = c;
    showScreen('screen-calendar');
    renderCalendar();
  }
}
function renderAirportList(c, target){
  const container = document.getElementById('airport-list');
  container.innerHTML = '';
  c.airports.forEach(a=>{
    const btn = document.createElement('button');
    btn.className = 'city-btn';
    btn.innerHTML = svgFlagRU() + `<span>${c[currentLang]} — ${a[currentLang]}</span>`;
    btn.onclick = ()=>{
      const cityWithAirport = Object.assign({}, c, {chosenAirport:a});
      if(target==='city1'){ booking.from = cityWithAirport; nextCityStep(); }
      else { booking.to = cityWithAirport; showScreen('screen-calendar'); renderCalendar(); }
    };
    container.appendChild(btn);
  });
}
function nextCityStep(){
  const t = translations[currentLang];
  if(booking.mode==='ru-uz'){
    renderCityList('uz','city2');
    document.getElementById('city2-question').textContent = t.ask_uz_city_to;
    showScreen('screen-city2');
  } else if(booking.mode==='uz-ru'){
    renderCityList('ru','city2');
    document.getElementById('city2-question').textContent = t.ask_ru_city_to;
    showScreen('screen-city2');
  }
}
function submitManualFrom(){
  const val = document.getElementById('input-from-manual').value.trim();
  if(!val){ document.getElementById('err-from-manual').style.display='block'; return; }
  document.getElementById('err-from-manual').style.display='none';
  booking.fromManual = val;
  showScreen('screen-manual-to');
}
function submitManualTo(){
  const val = document.getElementById('input-to-manual').value.trim();
  if(!val){ document.getElementById('err-to-manual').style.display='block'; return; }
  document.getElementById('err-to-manual').style.display='none';
  booking.toManual = val;
  showScreen('screen-calendar');
  renderCalendar();
}

/* ================= CALENDAR ================= */
let calYear, calMonth;
function renderCalendar(){
  const now = new Date();
  if(calYear===undefined){ calYear = now.getFullYear(); calMonth = now.getMonth(); }
  drawCalendar();
}
function calShift(dir){
  calMonth += dir;
  if(calMonth<0){calMonth=11; calYear--;}
  if(calMonth>11){calMonth=0; calYear++;}
  drawCalendar();
}
function drawCalendar(){
  document.getElementById('cal-title').textContent = `${MONTHS[currentLang][calMonth]} ${calYear}`;
  const wkContainer = document.getElementById('cal-weekdays');
  wkContainer.innerHTML = WEEKDAYS[currentLang].map(w=>`<div>${w}</div>`).join('');
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstDay = new Date(calYear, calMonth, 1);
  let startOffset = firstDay.getDay()-1; // Monday-first
  if(startOffset<0) startOffset=6;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<startOffset;i++){
    const blank = document.createElement('div');
    blank.className='cal-day blank';
    grid.appendChild(blank);
  }
  for(let d=1; d<=daysInMonth; d++){
    const cell = document.createElement('div');
    cell.className='cal-day';
    cell.textContent = d;
    const thisDate = new Date(calYear, calMonth, d);
    if(thisDate < today){
      cell.classList.add('past');
    } else {
      cell.onclick = ()=>{
        document.querySelectorAll('.cal-day.selected').forEach(e=>e.classList.remove('selected'));
        cell.classList.add('selected');
        booking.date = thisDate;
        setTimeout(()=>{
          showScreen('screen-contact');
          renderContactScreen();
        }, 220);
      };
    }
    grid.appendChild(cell);
  }
}

/* ================= CONTACT / MESSAGE ================= */
function labelFor(c){
  if(!c) return '';
  return c[currentLang] + (c.chosenAirport ? ` (${c.chosenAirport[currentLang]})` : '');
}
function formatDate(d, lang){
  if(!d) return '';
  return `${d.getDate()} ${MONTHS[lang][d.getMonth()]} ${d.getFullYear()}`;
}
function buildMessage(){
  const t = translations[currentLang];
  let route;
  if(booking.mode==='other'){
    route = `${booking.fromManual} → ${booking.toManual}`;
  } else {
    route = `${labelFor(booking.from)} → ${labelFor(booking.to)}`;
  }
  return `${t.msg_intro}\n${t.msg_route}: ${route}\n${t.msg_date}: ${formatDate(booking.date, currentLang)}`;
}

/* ================= ANIMATED BACKGROUND ================= */
function initBackground(){
  const canvas = document.getElementById('bgcanvas');
  const ctx = canvas.getContext('2d');
  let w,h,dots=[];
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  const count = Math.min(70, Math.floor((w*h)/18000));
  for(let i=0;i<count;i++){
    dots.push({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.6+0.6,
      vx:(Math.random()-0.5)*0.18,
      vy:(Math.random()-0.5)*0.18,
      o:Math.random()*0.5+0.15
    });
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{
      d.x += d.vx; d.y += d.vy;
      if(d.x<0) d.x=w; if(d.x>w) d.x=0;
      if(d.y<0) d.y=h; if(d.y>h) d.y=0;
      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${d.o})`;
      ctx.fill();
    });
    if(!reduceMotion) requestAnimationFrame(frame);
  }
  frame();
}
