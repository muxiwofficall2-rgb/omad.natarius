<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omad Tour</title>
<style>
  :root{
    --bg-1:#3a0a26;
    --bg-2:#5c1338;
    --bg-3:#7a1c46;
    --glass:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.22);
    --glass-hover:rgba(255,255,255,0.16);
    --text:#fbe9f0;
    --text-dim:#e7c3d4;
    --accent-red:#e8354f;
    --accent-red-dark:#c22440;
    --radius:20px;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-1);}
  body{
    color:var(--text);
    background:radial-gradient(circle at 20% 20%, var(--bg-3), var(--bg-2) 45%, var(--bg-1) 100%);
    position:relative;
  }
  #dots-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  #app{position:relative;z-index:1;height:100vh;width:100vw;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;}

  .screen{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:18px 18px 28px;
    overflow-y:auto;
    animation:slideIn .38s ease;
  }
  .screen.active{display:flex;}
  @keyframes slideIn{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:40px;}
  .topbar .spacer{flex:1;}

  .back-btn{
    background:var(--accent-red);
    color:#fff;border:none;border-radius:14px;
    padding:8px 16px;font-size:15px;font-weight:600;
    cursor:pointer; box-shadow:0 4px 14px rgba(230,50,80,.35);
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:active{background:var(--accent-red-dark);}

  .lang-switch{display:flex;gap:6px;}
  .lang-btn{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--text);border-radius:12px;
    padding:6px 10px;font-size:13px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:4px;
  }
  .lang-btn.active{background:var(--glass-hover);border-color:#fff;}

  .logo-wrap{display:flex;justify-content:center;margin:6px 0 18px;}
  .logo-circle{
    width:104px;height:104px;border-radius:50%;
    overflow:hidden;border:2px solid rgba(255,255,255,.35);
    box-shadow:0 8px 26px rgba(0,0,0,.35);
    background:#fff;display:flex;align-items:center;justify-content:center;
  }
  .logo-circle img{width:100%;height:100%;object-fit:cover;}

  .greeting{
    text-align:center;font-size:16px;line-height:1.5;
    color:var(--text);margin:0 6px 22px;font-weight:500;
  }

  .menu-list{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:6px;}
  .home-scroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;}

  .glass-btn{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--text);
    border-radius:var(--radius);
    padding:16px 18px;font-size:16px;font-weight:600;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;text-align:left;
    transition:background .15s ease, transform .1s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
  }
  .glass-btn:active{background:var(--glass-hover); transform:scale(.985);}
  .glass-btn .icon-circle{flex-shrink:0;}
  .glass-btn .label{flex:1;}
  .glass-btn .arrow{opacity:.6;font-size:18px;}

  .icon-circle{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-circle svg{width:19px;height:19px;}

  .section-text{
    font-size:14.5px;line-height:1.55;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:18px;
  }

  h2.title{font-size:18px;margin:0 0 14px;font-weight:700;text-align:center;}

  .list-col{display:flex;flex-direction:column;gap:10px;}

  .airport-sub{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px 14px;}
  .airport-sub .glass-btn{padding:11px 14px;font-size:14px;}

  input[type="text"], textarea{
    width:100%;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;color:var(--text);padding:13px 14px;font-size:15px;
    margin-bottom:6px;font-family:inherit;
  }
  textarea{min-height:120px;resize:vertical;}
  input::placeholder, textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .required-star{color:var(--accent-red);font-weight:800;margin-left:4px;}
  .field-label{font-size:14px;font-weight:600;margin:12px 0 6px;}
  .error-msg{color:var(--accent-red);font-size:12.5px;margin:-2px 0 10px;display:none;}

  .primary-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:16px;
    padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(230,50,80,.35);margin-top:6px;
  }
  .primary-btn:active{background:var(--accent-red-dark);}
  .primary-btn:disabled{opacity:.5;}

  /* Calendar */
  .calendar-card{
    background:#fff;color:#222;border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-btn{background:none;border:none;font-size:20px;color:#5c1338;cursor:pointer;padding:4px 10px;}
  .cal-month-label{font-weight:700;font-size:15.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11.5px;color:#999;font-weight:600;padding:4px 0;}
  .cal-day{padding:9px 0;border-radius:10px;font-size:14px;cursor:pointer;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:hover{background:#f1e0e8;}
  .cal-day.selected{background:var(--accent-red);color:#fff;font-weight:700;}
  .cal-day.past{opacity:.3;pointer-events:none;}

  /* contact */
  .contact-summary{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px;margin-bottom:16px;font-size:14.5px;line-height:1.6;
  }
  .contact-list{display:flex;flex-direction:column;gap:10px;}

  .addr-block{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.6;
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}

  .footer-note{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:16px;opacity:.7;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px;}
</style>

function telHref(num){ return "tel:" + num.replace(/[^\d+]/g,""); }
function smsHref(num, body){ return "sms:" + num.replace(/[^\d+]/g,"") + (body ? ("?body="+encodeURIComponent(body)) : ""); }
function waHref(num, body){ return "https://wa.me/" + num.replace(/[^\d]/g,"") + (body ? ("?text="+encodeURIComponent(body)) : ""); }

function pushScreen(name, opts){ history.push({name, opts}); render(); }
function goBack(){ if(history.length>1){ history.pop(); render(); } }
function goHome(){ history = [{name:"home"}]; render(); }

function setLang(l){ LANG = l; render(); }

/* ---------------- RENDER ---------------- */
function render(){
  const app = document.getElementById("app");
  const cur = history[history.length-1];
  app.innerHTML = screenHTML(cur.name, cur.opts||{});
  bindEvents(cur.name, cur.opts||{});
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function calendarScreen(opts){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1).getDay(); // 0=Sun
  const offset = (first+6)%7; // make Monday first
  const total = daysInMonth(y,m);
  const today = new Date(); today.setHours(0,0,0,0);
  let cells = "";
  for(let i=0;i<offset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=total; d++){
    const thisDate = new Date(y,m,d);
    const isPast = thisDate < today;
    const isSel = state.date && state.date.getFullYear()===y && state.date.getMonth()===m && state.date.getDate()===d;
    cells += `<div class="cal-day ${isPast?'past':''} ${isSel?'selected':''}" data-day="${d}">${d}</div>`;
  }
  const dow = t('dow').map(d=>`<div class="cal-dow">${d}</div>`).join("");
  return `<div class="screen active">
    ${topbar(true)}
    <h2 class="title">${t('chooseDate')}</h2>
    <div class="calendar-card">
      <div class="cal-head">
        <button class="cal-nav-btn" id="prevMonth">‹</button>
        <div class="cal-month-label">${t('mon')[m]} ${y}</div>
        <button class="cal-nav-btn" id="nextMonth">›</button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>
    </div>
  </div>`;
}

}

/* ---------------- EVENTS ---------------- */
function bindEvents(name, opts){
  document.getElementById("backBtn")?.addEventListener("click", goBack);
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.addEventListener("click", ()=> setLang(b.dataset.lang));
  });
  document.querySelectorAll("[data-go]").forEach(b=>{
    b.addEventListener("click", (e)=>{
      const go = b.dataset.go;
      if(go==="cityStep"){ pushScreen("cityStep", {direction:b.dataset.direction, step: parseInt(b.dataset.step)}); }
      else if(go==="otherCountry"){ pushScreen("otherCountry", {step:0}); }
      else { pushScreen(go, {}); }
    });
  });

  if(name==="cityStep"){
    document.querySelectorAll("[data-expand]").forEach(b=>{
      b.addEventListener("click",(e)=>{
        e.stopPropagation();
        const sub = document.getElementById("sub-"+b.dataset.expand);
        if(sub){ sub.style.display = sub.style.display==="none" ? "flex" : "none"; }
      });
    });
    document.querySelectorAll("[data-city]").forEach(b=>{
      b.addEventListener("click",(e)=>{
        if(b.hasAttribute("data-expand")) return; // handled by expand toggle
        const direction = opts.direction, step = opts.step;
        if(step===0){
          if(direction==="ru-uz") state.fromCity = b.dataset.city; else state.fromCity = b.dataset.city;
          state.direction = direction;
          pushScreen("cityStep", {direction, step:1});
        } else {
          state.toCity = b.dataset.city;
          pushScreen("calendar", {});
        }
      });
    });
  }

  if(name==="otherCountry"){
    state.direction = "other";
    if(opts.step===0){
      document.getElementById("otherNextBtn").addEventListener("click", ()=>{
        const val = document.getElementById("fromInput").value.trim();
        if(!val){ document.getElementById("fromErr").style.display="block"; return; }
        state.fromCustom = val;
        pushScreen("otherCountry", {step:1});
      });
    } else {
      document.getElementById("otherNextBtn2").addEventListener("click", ()=>{
        const val = document.getElementById("toInput").value.trim();
        if(!val){ document.getElementById("toErr").style.display="block"; return; }
        state.toCustom = val;
        pushScreen("calendar", {});
      });
    }
  }

  if(name==="calendar"){
    document.getElementById("prevMonth").addEventListener("click", ()=>{
      state.calMonth--; if(state.calMonth<0){state.calMonth=11; state.calYear--;}
      render();
    });
    document.getElementById("nextMonth").addEventListener("click", ()=>{
      state.calMonth++; if(state.calMonth>11){state.calMonth=0; state.calYear++;}
      render();
    });
    document.querySelectorAll(".cal-day:not(.empty):not(.past)").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.date = new Date(state.calYear, state.calMonth, parseInt(el.dataset.day));
        pushScreen("contact", {});
      });
    });
  }

  if(name==="help"){
    document.getElementById("helpSendBtn").addEventListener("click", ()=>{
      const val = document.getElementById("helpInput").value.trim();
      if(!val){ document.getElementById("helpErr").style.display="block"; return; }
      const subject = encodeURIComponent("Omad Tour — Yordam / Fikr-mulohaza");
      const body = encodeURIComponent(val);
      window.location.href = `mailto:${HELP_EMAIL}?subject=${subject}&body=${body}`;
    });
  }
}

/* ---------------- ANIMATED DOTS BACKGROUND ---------------- */
(function(){
  const canvas = document.getElementById("dots-canvas");
  const ctx = canvas.getContext("2d");
  let w,h,dots=[];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function initDots(){
    dots = [];
    const count = Math.floor((w*h)/9000);
    for(let i=0;i<count;i++){
      dots.push({
        x:Math.random()*w, y:Math.random()*h,
        r:Math.random()*1.6+0.4,
        vx:(Math.random()-0.5)*0.25,
        vy:(Math.random()-0.5)*0.25,
        a:Math.random()*0.5+0.15
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0) d.x=w; if(d.x>w) d.x=0;
      if(d.y<0) d.y=h; if(d.y>h) d.y=0;
      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${d.a})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize", ()=>{ resize(); initDots(); });
  resize(); initDots(); tick();
})();

/* ---------------- INIT ---------------- */
history.push({name:"home"});
render();
</script>
